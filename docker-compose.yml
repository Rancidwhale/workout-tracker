# Full stack: Postgres + migrations + FastAPI backend + React frontend.
#
# Uses prebuilt images only (no build: sections). Build and push them first,
# see README.md, then:
#
#   cp .env.example .env      # set SECRET_KEY and image names
#   docker compose up -d
#
# App:  http://localhost:8080      API:  http://localhost:8000/docs

name: workout-tracker

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workout_tracker}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (e.g. openssl rand -hex 32)}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workout_tracker}
    ports:
      # Published for local tools (psql, running uvicorn outside Docker).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies Alembic migrations, then exits. The backend waits for it.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/rancidwhale/workout-tracker-backend:latest}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/rancidwhale/workout-tracker-backend:latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/rancidwhale/workout-tracker-frontend:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
